<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7aboba's Birthday Countdown 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fredoka+One&family=Nunito:wght@600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root {
  --pink: #f4607a;
  --light-pink: #fce4ec;
  --purple: #9c27b0;
  --gold: #ffd54f;
  --dark: #1a0030;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0d0020 0%, #1a0035 40%, #0d0020 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  overflow: hidden; position: relative;
  font-family: 'Nunito', sans-serif;
}

/* ===== STARS BG ===== */
.star-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.star {
  position: absolute; border-radius: 50%;
  background: white; animation: twinkle ease-in-out infinite;
}
@keyframes twinkle {
  0%,100%{ opacity:.1; transform:scale(1); }
  50%    { opacity:.8; transform:scale(1.3); }
}

/* ===== FLOATING EMOJIS ===== */
.float-emoji {
  position: fixed; pointer-events: none; z-index: 1;
  animation: floatUp linear infinite;
  opacity: 0;
}
@keyframes floatUp {
  0%  { transform: translateY(110vh) rotate(0deg); opacity: 0; }
  10% { opacity: .5; }
  90% { opacity: .3; }
  100%{ transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}

/* ===== ORBS ===== */
.orb {
  position: fixed; border-radius: 50%;
  filter: blur(80px); pointer-events: none; z-index: 0;
  animation: orbDrift ease-in-out infinite alternate;
}
@keyframes orbDrift {
  from{ transform: scale(1) translate(0,0); opacity: .12; }
  to  { transform: scale(1.3) translate(30px,-30px); opacity: .2; }
}

/* ===== MAIN CARD ===== */
.main-card {
  position: relative; z-index: 2;
  width: min(92vw, 480px);
  display: flex; flex-direction: column;
  align-items: center; gap: 20px;
  padding: 10px 0 30px;
}

/* ===== TOP LABEL ===== */
.top-label {
  font-family: 'Nunito', sans-serif; font-weight: 700;
  font-size: .78rem; letter-spacing: 4px; text-transform: uppercase;
  color: rgba(255,255,255,.3);
  animation: blinkSlow 3s ease-in-out infinite;
}
@keyframes blinkSlow { 0%,100%{opacity:.2;} 50%{opacity:.7;} }

/* ===== NAME ===== */
.name-title {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(3rem, 13vw, 5rem);
  background: linear-gradient(135deg, #f4607a, #ce93d8, #ffd54f, #f4607a);
  background-size: 300% 300%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: gradShift 4s ease infinite;
  line-height: 1; text-align: center;
  filter: drop-shadow(0 0 20px rgba(244,96,122,.4));
}
@keyframes gradShift {
  0%,100%{ background-position: 0% 50%; }
  50%    { background-position: 100% 50%; }
}

/* ===== AGE CARD ===== */
.age-card {
  background: rgba(255,255,255,.06);
  border: 1.5px solid rgba(255,255,255,.1);
  backdrop-filter: blur(12px);
  border-radius: 24px; padding: 20px 24px;
  width: 100%; text-align: center;
}
.age-card-label {
  font-size: .8rem; font-weight: 700; letter-spacing: 1px;
  color: rgba(255,255,255,.4); margin-bottom: 10px;
}
.age-nums {
  font-family: 'Fredoka One', cursive;
  display: flex; justify-content: center; align-items: baseline;
  gap: 6px; flex-wrap: wrap;
}
.age-big { font-size: clamp(2.5rem, 10vw, 3.8rem); color: var(--pink); line-height: 1; }
.age-unit { font-size: .72rem; color: rgba(255,255,255,.35); font-family: 'Nunito',sans-serif; font-weight:700; margin-right: 10px; }
.age-med { font-size: clamp(1.6rem, 6vw, 2.2rem); color: #ce93d8; }
.age-small { font-size: clamp(1.1rem, 4vw, 1.5rem); color: rgba(255,255,255,.6); }

/* ===== DIVIDER ===== */
.divider {
  width: 60%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
}

/* ===== COUNTDOWN CARD ===== */
.countdown-card {
  background: rgba(255,255,255,.06);
  border: 1.5px solid rgba(255,255,255,.1);
  backdrop-filter: blur(12px);
  border-radius: 24px; padding: 20px 16px;
  width: 100%; text-align: center;
}
.countdown-label {
  font-size: .78rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
  color: var(--gold); margin-bottom: 14px; opacity: .8;
}
.countdown-label span { animation: blinkSlow 2s ease-in-out infinite; display: inline-block; }

.cd-boxes {
  display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
}
.cd-box {
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 16px; padding: 12px 10px;
  min-width: 68px; flex: 1; max-width: 90px;
  position: relative; overflow: hidden;
}
.cd-box::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 50%;
  background: rgba(255,255,255,.03);
  border-radius: 16px 16px 0 0;
}
.cd-num {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(1.8rem, 7vw, 2.5rem);
  color: white; line-height: 1;
  animation: numPop .3s ease;
}
@keyframes numPop {
  0%{ transform: scale(1.15); }
  100%{ transform: scale(1); }
}
.cd-unit {
  font-size: .65rem; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: rgba(255,255,255,.35);
  margin-top: 4px;
}

/* color accents per box */
.cd-box:nth-child(1) .cd-num { color: #f4607a; }
.cd-box:nth-child(2) .cd-num { color: #ce93d8; }
.cd-box:nth-child(3) .cd-num { color: var(--gold); }
.cd-box:nth-child(4) .cd-num { color: #80cbc4; }

/* ===== BOTTOM MSG ===== */
.bottom-msg {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(1.1rem, 4.5vw, 1.4rem);
  color: rgba(255,255,255,.5);
  text-align: center;
  animation: blinkSlow 4s ease-in-out infinite;
}

/* ===== HEART PULSE ===== */
.heart-pulse {
  font-size: 2rem;
  animation: heartBeat 1.3s ease-in-out infinite;
  display: inline-block;
}
@keyframes heartBeat {
  0%,100%{ transform: scale(1); }
  14%    { transform: scale(1.2); }
  28%    { transform: scale(1); }
  42%    { transform: scale(1.12); }
}

/* ===== BIRTHDAY MODE ===== */
#birthday-mode {
  display: none; position: fixed; inset: 0; z-index: 99;
  background: linear-gradient(135deg, #0d0020, #2d0050);
  flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 30px;
}
.bday-emoji { font-size: 4rem; animation: heartBeat 1s ease-in-out infinite; }
.bday-title {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(2.5rem, 10vw, 4rem);
  background: linear-gradient(135deg, #f4607a, #ffd54f, #ce93d8);
  background-size: 300% 300%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: gradShift 3s ease infinite;
  margin: 10px 0;
}
.bday-sub {
  font-family: 'Nunito', sans-serif; font-weight: 700;
  font-size: 1.1rem; color: rgba(255,255,255,.6);
}
</style>
</head>
<body>

<!-- ORBS -->
<div class="orb" style="width:400px;height:400px;background:#f4607a;top:-100px;left:-100px;animation-duration:8s;"></div>
<div class="orb" style="width:350px;height:350px;background:#9c27b0;bottom:-80px;right:-80px;animation-duration:10s;animation-delay:2s;"></div>
<div class="orb" style="width:250px;height:250px;background:#ffd54f;top:50%;left:60%;animation-duration:7s;animation-delay:1s;"></div>

<!-- STARS -->
<div class="star-bg" id="starBg"></div>

<!-- FLOATING EMOJIS -->
<div id="floatEmojis"></div>

<!-- MAIN -->
<div class="main-card">
  <div class="top-label">✦ &nbsp; a little something special &nbsp; ✦</div>

  <div class="name-title">7aboba 🎀</div>

  <!-- AGE CARD -->
  <div class="age-card">
    <div class="age-card-label">🌟 You've been making the world beautiful for</div>
    <div class="age-nums" id="ageNums">
      <span class="age-big" id="ageY">-</span><span class="age-unit">years</span>
      <span class="age-med" id="ageD">-</span><span class="age-unit">days</span>
      <span class="age-small" id="ageT">--:--:--</span><span class="age-unit">hrs</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- COUNTDOWN CARD -->
  <div class="countdown-card">
    <div class="countdown-label">
      <span>🎂</span> &nbsp; her birthday is in &nbsp; <span>🎂</span>
    </div>
    <div class="cd-boxes">
      <div class="cd-box"><div class="cd-num" id="cdD">--</div><div class="cd-unit">days</div></div>
      <div class="cd-box"><div class="cd-num" id="cdH">--</div><div class="cd-unit">hours</div></div>
      <div class="cd-box"><div class="cd-num" id="cdM">--</div><div class="cd-unit">mins</div></div>
      <div class="cd-box"><div class="cd-num" id="cdS">--</div><div class="cd-unit">secs</div></div>
    </div>
  </div>

  <div class="bottom-msg">
    she deserves the whole universe ✨
  </div>

  <div>
    <span class="heart-pulse">💖</span>
    <span class="heart-pulse" style="animation-delay:.2s;">💗</span>
    <span class="heart-pulse" style="animation-delay:.4s;">💕</span>
  </div>
</div>

<!-- BIRTHDAY MODE -->
<div id="birthday-mode">
  <div class="bday-emoji">🎂</div>
  <div class="bday-title">Happy Birthday<br>7aboba! 🎉</div>
  <div class="bday-sub" style="margin-top:10px;">kol sana w enti tayeba 💖</div>
</div>

<script>
// ===== STARS =====
(function(){
  const bg = document.getElementById('starBg');
  for(let i=0;i<80;i++){
    const s=document.createElement('div');
    s.className='star';
    const size=1+Math.random()*2.5;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s;`;
    bg.appendChild(s);
  }
})();

// ===== FLOATING EMOJIS =====
(function(){
  const emojis=['🌸','💕','✨','🎀','💫','⭐','🌟','💖','🎊','🎉'];
  const container=document.getElementById('floatEmojis');
  for(let i=0;i<12;i++){
    const e=document.createElement('div');
    e.className='float-emoji';
    e.textContent=emojis[i%emojis.length];
    e.style.cssText=`left:${Math.random()*100}%;font-size:${1+Math.random()*.8}rem;animation-duration:${10+Math.random()*10}s;animation-delay:${Math.random()*10}s;`;
    container.appendChild(e);
  }
})();

// ===== DATES =====
const birthday = new Date('2007-05-18T00:00:00');

function getNextBirthday() {
  const now = new Date();
  const thisYear = now.getFullYear();
  let next = new Date(thisYear, 4, 18, 0, 0, 0); // May 18
  if (now >= next) next = new Date(thisYear+1, 4, 18, 0, 0, 0);
  return next;
}

function isBirthday() {
  const now = new Date();
  return now.getMonth()===4 && now.getDate()===18;
}

function tick() {
  const now = new Date();

  // Age counter
  const diff = now - birthday;
  const years = Math.floor(diff / (365.25*24*3600*1000));
  const afterYears = new Date(birthday);
  afterYears.setFullYear(afterYears.getFullYear()+years);
  const days = Math.floor((now-afterYears)/(24*3600*1000));
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('ageY').textContent = years;
  document.getElementById('ageD').textContent = days;
  document.getElementById('ageT').textContent = `${h}:${m}:${s}`;

  // Countdown
  if(isBirthday()){
    document.getElementById('birthday-mode').style.display='flex';
    document.querySelector('.main-card').style.display='none';
    return;
  }
  const next = getNextBirthday();
  const left = next - now;
  const cd = Math.floor(left/(24*3600*1000));
  const ch = Math.floor((left%(24*3600*1000))/(3600*1000));
  const cm = Math.floor((left%(3600*1000))/(60*1000));
  const cs = Math.floor((left%60000)/1000);
  document.getElementById('cdD').textContent = String(cd).padStart(2,'0');
  document.getElementById('cdH').textContent = String(ch).padStart(2,'0');
  document.getElementById('cdM').textContent = String(cm).padStart(2,'0');
  document.getElementById('cdS').textContent = String(cs).padStart(2,'0');
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
